# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). On a Mac:  brew install xcodegen && cd ios && xcodegen
# Generates TEKME.xcodeproj. Set your own Team and bundle-ID prefix before building. NOT YET VERIFIED.
name: TEKME
options:
  bundleIdPrefix: com.example.tekme   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""              # your Personal Team or paid team ID (set in Xcode)
    CODE_SIGN_STYLE: Automatic
targets:
  TEKME:
    type: application
    platform: iOS
    sources: [TEKMEApp, Shared]
    info:
      path: TEKMEApp/Info.plist
      properties:
        CFBundleDisplayName: TEKMĒ
        UILaunchScreen: {}
    dependencies:
      - target: TEKMEFilter
  TEKMEFilter:
    type: app-extension
    platform: iOS
    sources:
      - TEKMEFilter
      - Shared
    info:
      path: TEKMEFilter/Info.plist
    dependencies:
      - sdk: IdentityLookup.framework
  TEKMETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests                       # includes Tests/Fixtures/expected.json as a resource
      - path: Shared/tekme_compact.json
        buildPhase: resources
    dependencies:
      - target: TEKME
schemes:
  TEKME:
    build:
      targets: { TEKME: all, TEKMEFilter: all }
    test:
      targets: [TEKMETests]
